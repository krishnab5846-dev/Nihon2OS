<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary | NihonOS</title>

  <link rel="stylesheet" href="../style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">

  <h1>🇯🇵 NihonOS</h1>

  <ul>
    <li><a href="../index.html">🏠 Dashboard</a></li>
    <li class="active"><a href="vocabulary.html">📚 Vocabulary</a></li>
    <li><a href="#">✍ Grammar</a></li>
    <li><a href="#">🈶 Kanji</a></li>
    <li><a href="#">🔤 Hiragana</a></li>
    <li><a href="#">🔠 Katakana</a></li>
    <li><a href="#">🧠 Flashcards</a></li>
    <li><a href="#">🎧 Listening</a></li>
    <li><a href="#">📝 Notes</a></li>
    <li><a href="#">🤖 AI Tutor</a></li>
  </ul>

</div>

<!-- Main Content -->
<div class="main">

  <!-- Top Section -->
  <div class="top-section">

    <!-- Left -->
    <div class="left-panel">

      <h2>📚 N5 Vocabulary</h2>
      <p>Browse your vocabulary collection.</p>

      <div class="progress-box">

        <div class="progress-top">
          <span id="progressText">0 / 0 Learned</span>
          <span id="progressPercent">0%</span>
        </div>

        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>

      </div>

    </div>

    <!-- Right -->
    <div class="practice-box">

      <h3>🎲 Random Practice</h3>

      <h1 id="practiceJapanese">食べる</h1>

      <h3 id="practiceReading">たべる</h3>

      <p id="practiceMeaning">••••••</p>

      <div class="practice-buttons">

        <button id="showMeaningBtn">Show</button>

        <button id="randomBtn">Next</button>

      </div>

    </div>

  </div>

  <!-- Search -->
  <input
    id="search"
    type="text"
    placeholder="🔍 Search Japanese or English..."
    class="search-bar"
  >

  <!-- Filters -->
  <div class="filter-container">

    <button class="filter-btn" onclick="filterWords('All')">All</button>

    <button class="filter-btn" onclick="filterWords('Verb')">Verb</button>

    <button class="filter-btn" onclick="filterWords('Noun')">Noun</button>

    <button class="filter-btn" onclick="filterWords('Adjective')">Adjective</button>

  </div>

  <!-- Vocabulary Grid -->
  <div id="wordList"></div>

</div>

<script src="../data/n5.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/vocabulary.js"></script>
<script src="../script.js"></script>

</body>
</html>
